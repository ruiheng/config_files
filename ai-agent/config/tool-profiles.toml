version = 2

# Optional candidate startup_message is used only for a new session.
# `${templates.name}` in a candidate command expands [templates].name.

[templates]
codex_approval = "--ask-for-approval on-request"
claude_edits = "--permission-mode acceptEdits"

[roles]
planner = "planner_default"
worker = "coder_default"
explainer = "explainer_default"
coder = "coder_default"
reviewer = "reviewer_default"
architect = "architect_default"
# An architect override also applies to these compatibility roles.
architect_author = "architect_default"
architect_reviewer = "architect_default"
browser_tester = "browser_tester_default"
roundtable_participant = "roundtable_participant_default"

[profiles.planner_default]
strategy = "ordered"

[[profiles.planner_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=max ${templates.codex_approval}"

[[profiles.planner_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium ${templates.codex_approval}"

[profiles.coder_default]
strategy = "ordered"

[[profiles.coder_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=max ${templates.codex_approval}"

[[profiles.coder_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium ${templates.codex_approval}"

[[profiles.coder_default.candidates]]
command = "claude --model sonnet ${templates.claude_edits}"

[profiles.explainer_default]
strategy = "ordered"

[[profiles.explainer_default.candidates]]
command = "agy --model gemini-3.6-flash-high"

[[profiles.explainer_default.candidates]]
command = "codex --model gpt-5.6-luna -c model_reasoning_effort=max ${templates.codex_approval}"

[[profiles.explainer_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium ${templates.codex_approval}"

[[profiles.explainer_default.candidates]]
command = "claude --model sonnet ${templates.claude_edits}"

[profiles.reviewer_default]
strategy = "ordered"

[[profiles.reviewer_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=max ${templates.codex_approval}"

[[profiles.reviewer_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=xhigh ${templates.codex_approval}"

[[profiles.reviewer_default.candidates]]
command = "claude --model sonnet ${templates.claude_edits}"

[profiles.architect_default]
strategy = "ordered"

[[profiles.architect_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=max ${templates.codex_approval}"

[[profiles.architect_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=xhigh ${templates.codex_approval}"

[profiles.browser_tester_default]
strategy = "ordered"

[[profiles.browser_tester_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=medium"

[[profiles.browser_tester_default.candidates]]
command = "codex -m gpt-5.5 -c model_reasoning_effort=low"

[profiles.roundtable_participant_default]
strategy = "ordered"

[[profiles.roundtable_participant_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=xhigh ${templates.codex_approval}"

[[profiles.roundtable_participant_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium ${templates.codex_approval}"
