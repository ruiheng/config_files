version = 2

# Optional candidate startup_message is used only for a new session.

[roles]
planner = "planner_default"
worker = "coder_default"
explainer = "explainer_default"
coder = "coder_default"
reviewer = "reviewer_default"
architect = "architect_default"
browser_tester = "browser_tester_default"
roundtable_participant = "roundtable_participant_default"

[profiles.planner_default]
strategy = "ordered"

[[profiles.planner_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=max --ask-for-approval on-request"

[[profiles.planner_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium --ask-for-approval on-request"

[profiles.coder_default]
strategy = "ordered"

[[profiles.coder_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=max --ask-for-approval on-request"

[[profiles.coder_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium --ask-for-approval on-request"

[[profiles.coder_default.candidates]]
command = "claude --model sonnet --permission-mode acceptEdits"

[profiles.explainer_default]
strategy = "ordered"

[[profiles.explainer_default.candidates]]
command = "agy --model gemini-3.6-flash-high"

[[profiles.explainer_default.candidates]]
command = "codex --model gpt-5.6-luna -c model_reasoning_effort=max --ask-for-approval on-request"

[[profiles.explainer_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium --ask-for-approval on-request"

[[profiles.explainer_default.candidates]]
command = "claude --model sonnet --permission-mode acceptEdits"

[profiles.reviewer_default]
strategy = "ordered"

[[profiles.reviewer_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=max --ask-for-approval on-request"

[[profiles.reviewer_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=xhigh --ask-for-approval on-request"

[[profiles.reviewer_default.candidates]]
command = "claude --model sonnet --permission-mode acceptEdits"

[profiles.architect_default]
strategy = "ordered"

[[profiles.architect_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=max --ask-for-approval on-request"

[[profiles.architect_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=xhigh --ask-for-approval on-request"

[profiles.browser_tester_default]
strategy = "ordered"

[[profiles.browser_tester_default.candidates]]
command = "codex --model gpt-5.6-terra -c model_reasoning_effort=medium"

[[profiles.browser_tester_default.candidates]]
command = "codex -m gpt-5.5 -c model_reasoning_effort=low"

[profiles.roundtable_participant_default]
strategy = "ordered"

[[profiles.roundtable_participant_default.candidates]]
command = "codex --model gpt-5.6-sol -c model_reasoning_effort=xhigh --ask-for-approval on-request"

[[profiles.roundtable_participant_default.candidates]]
command = "codex --model gpt-5.5 -c model_reasoning_effort=medium --ask-for-approval on-request"
